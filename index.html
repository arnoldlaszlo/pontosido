<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <!-- Teljes képernyős nézet kikényszerítése, belenagyítás tiltása -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#000000">
    <title>Pontos Idő</title>
    
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
    
    <style>
        /* iOS 12.5.5 Safari javítás: Brutális fekete háttér minden létező szinten */
        html {
            background-color: #000000 !important;
            background: #000000 !important;
        }
        
        body {
            background-color: #000000 !important;
            background: #000000 !important;
            color: #ffffff;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: fixed; /* Megakadályozza a görgetést, ami előhozhatná a fehér hátteret */
            top: 0;
            left: 0;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Biztonságos monospace iOS 12-n */
        }
        
        /* A tartalmat tartó doboz, ami a body helyett végzi a középre igazítást */
        #container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
        }

        #clock {
            /* 20vw azt jelenti, hogy 1 karakter kb a képernyő szélességének 1/8-a. 
               Mivel 8 karakter a "00:00:00", ez teljesen faltól falig ér majd. */
            font-size: 20vw; 
            font-weight: bold;
            line-height: 1;
            white-space: nowrap;
            text-align: center;
        }

        #date {
            /* A dátum kisebb, a képernyő szélességének 6%-a */
            font-size: 6vw;
            margin-top: 2vh;
            opacity: 0.8;
            white-space: nowrap;
            text-align: center;
        }

        /* Indítóképernyő továbbra is kell az ébrentartás miatt */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #start-btn {
            font-size: 24px;
            padding: 20px 40px;
            background-color: #222222;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 15px;
            cursor: pointer;
            font-family: inherit;
        }

        #start-overlay p {
            margin-top: 20px;
            font-size: 18px;
            color: #aaaaaa;
            text-align: center;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        <button id="start-btn">Óra indítása</button>
        <p>Bökj a gombra az elalvás-védelemhez!</p>
    </div>

    <!-- Csomagoló div, ami garantálja a fekete hátteret -->
    <div id="container">
        <div id="clock">Betöltés</div>
        <div id="date"></div>
    </div>

    <script>
        let noSleep = null;
        if (typeof NoSleep !== 'undefined') {
            noSleep = new NoSleep();
        }

        document.getElementById('start-btn').addEventListener('click', function() {
            if (noSleep) {
                noSleep.enable();
            } else if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(function(err) {});
            }
            
            document.getElementById('start-overlay').style.display = 'none';
        });

        let timeOffset = 0;
        const clockElement = document.getElementById('clock');
        const dateElement = document.getElementById('date');
        const daysShort = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];

        function updateDisplay() {
            const now = new Date(Date.now() + timeOffset);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.textContent = hours + ":" + minutes + ":" + seconds;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dayOfWeek = daysShort[now.getDay()];
            
            dateElement.textContent = year + "-" + month + "-" + day + " " + dayOfWeek;
        }

        async function syncTimeWithServer() {
            try {
                const localStart = Date.now();
                const response = await fetch('https://worldtimeapi.org/api/timezone/Europe/Budapest');
                const data = await response.json();
                
                const latency = (Date.now() - localStart) / 2;
                const serverTime = new Date(data.datetime).getTime();
                timeOffset = serverTime - Date.now() + latency;
            } catch (error) {
                console.error('Szerver hiba, a helyi gépidőt használjuk.', error);
            }
            
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        syncTimeWithServer();
    </script>
</body>
</html>
