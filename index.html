<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <!-- iOS specifikus beállítások, hogy alkalmazás-szerű legyen és alkalmazkodjon -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pontos Idő</title>
    
    <!-- NoSleep.js a képernyő ébrentartásához (régi és új eszközökön is) -->
    <script src="https://cdn.jsdelivr.net/npm/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
    
    <style>
        /* Régi iOS bug javítása: stabil 100% magasság és erőszakos fekete háttér */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: monospace;
            overflow: hidden; /* Nincs görgetés */
        }
        
        /* Régi böngészőkkel is kompatibilis középre igazítás */
        body {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-box-pack: center;
            -webkit-justify-content: center;
            justify-content: center;
            text-align: center;
        }

        #clock {
            /* Képernyőszélességhez alkalmazkodó méret */
            font-size: 18vw; 
            font-weight: bold;
            line-height: 1;
            white-space: nowrap; /* Ne törjön két sorba */
        }

        #date {
            font-size: 6vw;
            margin-top: 2vh;
            opacity: 0.8;
            white-space: nowrap;
        }

        /* Ha a képernyő fekvő (iPad) vagy asztali, egy kicsit kisebb betűk is elegek */
        @media (min-aspect-ratio: 1/1) {
            #clock { font-size: 14vw; }
            #date { font-size: 4vw; }
        }

        /* Kezdőképernyő stílusai */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #start-btn {
            font-size: 5vw;
            padding: 20px 40px;
            background-color: #333333;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 15px;
            cursor: pointer;
            font-family: monospace;
        }

        #start-overlay p {
            margin-top: 30px;
            font-size: 4vw;
            color: #aaaaaa;
            text-align: center;
            padding: 0 20px;
        }
        
        @media (min-aspect-ratio: 1/1) {
            #start-btn { font-size: 2.5vw; }
            #start-overlay p { font-size: 2vw; }
        }
    </style>
</head>
<body>
    <!-- Ez a felület fogadja a kattintást, hogy aktiválhassuk az ébrentartást -->
    <div id="start-overlay">
        <button id="start-btn">Óra indítása</button>
        <p>A képernyő ébrentartásához bökj a gombra!</p>
    </div>

    <!-- Maga az óra -->
    <div id="clock">Betöltés...</div>
    <div id="date"></div>

    <script>
        // 1. Ébrentartás (Wake Lock) és Indítás logikája
        let noSleep = null;
        if (typeof NoSleep !== 'undefined') {
            noSleep = new NoSleep();
        }

        document.getElementById('start-btn').addEventListener('click', function() {
            // Ébrentartás engedélyezése kattintás után
            if (noSleep) {
                noSleep.enable();
            } else if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(function(err) {});
            }
            
            // Indító képernyő eltüntetése
            document.getElementById('start-overlay').style.display = 'none';
            
            // Opcionális: Teljes képernyő kérése (nem minden iOS támogatja, de megpróbáljuk)
            let docEl = document.documentElement;
            if (docEl.requestFullscreen) { docEl.requestFullscreen().catch(function(){}); }
            else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }
        });

        // 2. Pontos idő logikája
        let timeOffset = 0;
        const clockElement = document.getElementById('clock');
        const dateElement = document.getElementById('date');
        const daysShort = ['V', 'H', 'K', 'Sze', 'Cs', 'P', 'Szo'];

        function updateDisplay() {
            const now = new Date(Date.now() + timeOffset);
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockElement.textContent = hours + ":" + minutes + ":" + seconds;

            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dayOfWeek = daysShort[now.getDay()];
            
            dateElement.textContent = year + "-" + month + "-" + day + " " + dayOfWeek;
        }

        async function syncTimeWithServer() {
            try {
                const localStart = Date.now();
                const response = await fetch('https://worldtimeapi.org/api/timezone/Europe/Budapest');
                const data = await response.json();
                
                const latency = (Date.now() - localStart) / 2;
                const serverTime = new Date(data.datetime).getTime();
                timeOffset = serverTime - Date.now() + latency;
            } catch (error) {
                console.error('Szerver szinkronizáció sikertelen (lehet, hogy régi az iPad tanúsítványa), helyi időt használunk.', error);
            }
            
            updateDisplay();
            setInterval(updateDisplay, 1000);
        }

        syncTimeWithServer();
    </script>
</body>
</html>
